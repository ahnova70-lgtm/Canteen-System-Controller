kind = "web"
previewPath = "/"
title = "Smart Canteen Management System"
description = "A professional installable PWA for managing canteen deliveries, receiving, inventory audits, and AI-assisted operational reports across driver, worker, auditor, and administrator roles."
version = "1.0.0"
id = "artifacts/smart-canteen"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19783

[services.development]
run = "pnpm --filter @workspace/smart-canteen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-canteen", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-canteen/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19783"
BASE_PATH = "/"
